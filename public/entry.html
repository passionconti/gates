<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가계부 정보 입력</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel panel-wide">
        <div class="eyebrow">Step 2</div>
        <h1>선택한 시트에 가계부 항목을 여러 건 입력하세요</h1>
        <p class="intro">
          한 번에 여러 줄을 입력한 뒤 한 번에 저장할 수 있습니다. 첫 화면에서 고른 Spreadsheet와
          시트 탭은 아래에 표시되며, 필요하면 대상 선택으로 돌아가 다시 고를 수 있습니다.
        </p>

        <section class="section">
          <div class="section-head">
            <h2>저장 대상</h2>
            <a id="change-target-link" class="sheet-link" href="/">대상 다시 선택</a>
          </div>
          <p class="muted">Spreadsheet: <strong id="target-name"></strong></p>
          <p class="muted">시트 탭: <strong id="target-sheet"></strong></p>
          <a
            id="spreadsheet-link"
            class="sheet-link hidden"
            href="#"
            target="_blank"
            rel="noreferrer"
          >선택한 Spreadsheet 열기</a>
        </section>

        <form id="entry-form" class="form">
          <section class="section">
            <div class="section-head">
              <div>
                <h2>가계부 항목 입력</h2>
                <p class="muted compact">
                  날짜, 수입/지출 구분, 카테고리, 내용, 명의, 지출방식, 금액, 비고를 입력한 뒤
                  전체 저장을 눌러 주세요.
                </p>
              </div>
              <button type="button" id="add-row-button" class="secondary action-button">+ 행 추가</button>
            </div>

            <div id="entry-rows" class="entry-rows"></div>
          </section>

          <button type="submit" id="submit-button">입력한 항목 전체 저장</button>
        </form>

        <div id="result" class="result hidden"></div>
      </section>
    </main>

    <script src="/shared.js"></script>
    <script src="/entry-helpers.js"></script>
    <script src="/entry.js"></script>
  </body>
</html>
