<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가계부 시트 선택</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="eyebrow">Step 1</div>
        <h1>먼저 Google 인증과 저장 대상을 선택하세요</h1>
        <p class="intro">
          첫 화면에서 Google 계정으로 인증하고, 데이터를 저장할 Spreadsheet와 시트 탭을
          고른 뒤 다음 단계로 이동합니다.
        </p>

        <div id="config-banner" class="banner hidden"></div>

        <section class="auth-card">
          <div>
            <h2>1. Google 로그인</h2>
            <p id="auth-status" class="muted">아직 Google 인증이 완료되지 않았습니다.</p>
          </div>
          <div class="auth-actions">
            <button type="button" id="login-button">Google 로그인</button>
            <button type="button" id="logout-button" class="secondary hidden">연결 해제</button>
          </div>
        </section>

        <form id="selection-form" class="form">
          <section class="section">
            <div class="section-head">
              <h2>2. 저장 대상 선택</h2>
              <button type="button" id="refresh-button" class="secondary" disabled>목록 새로고침</button>
            </div>

            <label>
              <span>Spreadsheet 파일</span>
              <select id="spreadsheet-select" name="spreadsheetId" required disabled>
                <option value="">로그인 후 파일 목록을 불러옵니다</option>
              </select>
            </label>

            <label>
              <span>시트 탭</span>
              <select id="sheet-select" name="sheetName" required disabled>
                <option value="">먼저 Spreadsheet를 선택해 주세요</option>
              </select>
            </label>

            <a
              id="spreadsheet-link"
              class="sheet-link hidden"
              href="#"
              target="_blank"
              rel="noreferrer"
            >선택한 Spreadsheet 열기</a>
          </section>

          <button type="submit" id="continue-button" disabled>다음 단계로 이동</button>
        </form>

        <div id="result" class="result hidden"></div>
      </section>
    </main>

    <script src="/shared.js"></script>
    <script src="/selection.js"></script>
  </body>
</html>
